version: '3.8'

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rxup_local
      POSTGRES_USER: user_local
      POSTGRES_PASSWORD: password_local
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html:cached
    depends_on:
      - database
    # Añadimos variables de entorno para que PHP sepa dónde está la DB
    environment:
      DATABASE_URL: "postgresql://user_local:password_local@database:5432/rxup_local?serverVersion=16&charset=utf8"
      APP_ENV: dev

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  adminer: # Herramienta web para gestionar la DB fácilmente
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - database

# Esta es la sección que faltaba para definir el volumen persistente de Postgres
volumes:
  db-data:
